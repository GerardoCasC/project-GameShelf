<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F2B" />
      <stop offset="100%" stop-color="#3B1E6B" />
    </linearGradient>

    <linearGradient id="rune" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4E9FF" />
      <stop offset="55%" stop-color="#C9B4FF" />
      <stop offset="100%" stop-color="#6A3CEB" />
    </linearGradient>

    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6D8" />
      <stop offset="100%" stop-color="#EED9B7" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Anillo exterior simple -->
  <circle
    cx="32"
    cy="32"
    r="21"
    fill="none"
    stroke="#9B83FF"
    stroke-width="2"
    opacity="0.55"
  />

  <!-- Runa principal -->
  <g fill="url(#rune)">
    <!-- media luna / arco -->
    <path
      d="M39.5 18
         C45.5 20 48.5 26 47.2 32
         C45.9 38.2 41 43 34 44
         C38.3 41.8 40.8 37.8 40.8 33
         C40.8 27.8 37.4 22.5 32 20
         C34.1 17.9 36.8 17.2 39.5 18Z"
    />

    <!-- eje vertical -->
    <path
      d="M30.5 15
         L33.5 15
         L33.5 42
         C33.5 46.5 31.8 50.2 28.3 53.5
         L26.2 51.8
         C29.1 49 30.5 46.1 30.5 42.4Z"
    />

    <!-- punta superior -->
    <path d="M32 8 L36 15 L28 15 Z" />

    <!-- punta inferior -->
    <path d="M32 56 L36 49 L28 49 Z" />

    <!-- cola curva de la runa -->
    <path
      d="M31.5 35
         C27.8 34.8 24.8 36.4 23.2 39
         C21.5 41.8 22.4 45.1 25.3 47.2
         C27.1 48.5 29.7 49.3 32 51.5
         L34.2 49.8
         C32.6 47.8 30.5 46.5 28.6 45.5
         C26.4 44.3 25.7 42.4 26.8 40.9
         C27.9 39.4 29.9 38.7 32.2 38.8Z"
    />
  </g>

  <!-- Estrella central -->
  <path
    d="M32 24
       L34.3 29.7
       L40 32
       L34.3 34.3
       L32 40
       L29.7 34.3
       L24 32
       L29.7 29.7 Z"
    fill="url(#star)"
  />

  <!-- Destellos mágicos simples -->
  <circle cx="18" cy="22" r="1.2" fill="#F4E9FF" opacity="0.9" />
  <circle cx="46" cy="22" r="1.2" fill="#F4E9FF" opacity="0.9" />
  <circle cx="45" cy="44" r="1" fill="#C9B4FF" opacity="0.85" />
</svg>